
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Video Studio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      padding: 20px;
      max-width: 650px;
      margin: auto;
    }
    textarea, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border-radius: 10px;
      font-size: 16px;
    }
    textarea { min-height: 120px; }
    button {
      background: #2563eb;
      color: white;
      border: none;
    }
    #result {
      white-space: pre-wrap;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <h2>🎬 AI Video Studio</h2>
  <p>اكتب فكرة الفيديو بتاعتك:</p>

  <textarea id="idea"
    placeholder="مثال: قصة قصيرة عن مغامرة في الفضاء"></textarea>

  <button onclick="createScenes()">تجهيز المشاهد</button>

  <div id="result"></div>

  <script>
    function createScenes() {
      const idea = document.getElementById("idea").value.trim();
      const result = document.getElementById("result");

      if (!idea) {
        result.textContent = "اكتب فكرة الفيديو الأول.";
        return;
      }

      result.textContent =
        "فكرة الفيديو:\n" + idea +
        "\n\nتم تسجيل فكرتك بنجاح! 🎬" +
        "\n\nالخطوة القادمة: تحويل الفكرة إلى مشاهد.";
    }
  </script>
</body>
</html>
